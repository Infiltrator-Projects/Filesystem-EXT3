# SPDX-License-Identifier: GPL-3.0-or-later
# Qualification only. NO kernel module, V1 driver fallback, or publication.
name: Qualify source-owned EXT3 V2 DEB and native RUN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ext3-qualify-${ github.ref }
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install portable filesystem qualification dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev
      - name: Build exact source-owned portable V2 DEB and source-embedded RUN
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" -eq 1
          work="$RUNNER_TEMP/portable-root"
          mkdir -p "$work"
          dpkg-deb -x dist/*.deb "$work"
          test "$(find "$work" -type f | wc -l)" -eq 2
          ! find "$work" -name '*.ko' | grep .
          test -s "$work/System/Filesystems/EXT3.so"
          readelf -SW "$work/System/Filesystems/EXT3.so" | grep -F '.infiltrator_boot'
          sh tests/check_v2_exports.sh "$work/System/Filesystems/EXT3.so"
          sh tests/check_production_boundary.sh "$work/System/Filesystems/EXT3.so"
      - name: Prove native source RUN packages V2 only
        run: |
          set -euo pipefail
          runfile=$(find dist -maxdepth 1 -name '*.run' -print -quit)
          bash "$runfile" --profile aggressive --system-package-mode --build-only --output "$RUNNER_TEMP/native"
          package=$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)
          test -s "$package"
          test "$(dpkg-deb -f "$package" X-Infiltrator-Native-Profile)" = aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$package" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" -eq 2
          ! find "$RUNNER_TEMP/native-root" -name '*.ko' | grep .
          sh tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/EXT3.so"
      - uses: actions/upload-artifact@v4
        with:
          name: ext3-v2-unreleased
          path: dist/*
          if-no-files-found: error
          retention-days: 14
# The separate firmware-ext3.yml performs the actual production BOOT validator
# and OVMF kernel/initramfs reads before a new version can be published.
